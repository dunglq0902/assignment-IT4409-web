15e">onAdd(data)</text><text x="1010" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#34415e">user prop</text><path d="M1270 560 V655 H750 V570" fill="none" stroke="#3159d8" stroke-width="4" marker-end="url(#arrow)"/><text x="1045" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#34415e">onAdded() → App đặt newUser = null</text><text x="750" y="752" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#53617d">Props đi xuống; component con gọi callback do App truyền xuống.</text></svg>